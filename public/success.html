<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>결제 처리 중</title>
<style>
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f7f7f8;
  }
  .box {
    background: white;
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    width: 360px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .icon { font-size: 48px; }
  h1 { font-size: 18px; margin: 12px 0; }
  p { color: #767680; font-size: 13px; word-break: break-all; }
  a { display: inline-block; margin-top: 16px; color: #3182f6; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="box" id="result">
  <div class="icon">⏳</div>
  <h1>결제 승인 처리 중입니다...</h1>
</div>

<script>
async function confirmPayment() {
  const params = new URLSearchParams(window.location.search);
  const paymentKey = params.get("paymentKey");
  const orderId = params.get("orderId");
  const amount = params.get("amount");

  const resultBox = document.getElementById("result");

  try {
    const res = await fetch("/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.message || "승인 실패");
    }

    resultBox.innerHTML = `
      <div class="icon">✅</div>
      <h1>결제가 완료되었습니다</h1>
      <p>주문번호: ${data.orderId}</p>
      <p>결제금액: ${Number(data.totalAmount).toLocaleString("ko-KR")}원</p>
      <p>결제수단: ${data.method || "-"}</p>
      <a href="/">쇼핑 계속하기</a>
    `;
  } catch (err) {
    resultBox.innerHTML = `
      <div class="icon">❌</div>
      <h1>결제 승인에 실패했습니다</h1>
      <p>${err.message}</p>
      <a href="/">돌아가기</a>
    `;
  }
}

confirmPayment();
</script>
</body>
</html>

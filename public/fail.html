<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>결제 실패</title>
<style>
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f7f7f8;
  }
  .box {
    background: white;
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    width: 360px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .icon { font-size: 48px; }
  h1 { font-size: 18px; margin: 12px 0; }
  p { color: #767680; font-size: 13px; word-break: break-all; }
  a { display: inline-block; margin-top: 16px; color: #3182f6; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">❌</div>
  <h1>결제가 취소되었습니다</h1>
  <p id="reason"></p>
  <a href="/">돌아가기</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("reason").textContent = params.get("message") || "사용자에 의해 결제가 중단되었습니다.";
</script>
</body>
</html>
